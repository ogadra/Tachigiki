name: worker

on:
  push:
    paths: ["worker/**"]
  pull_request:
    paths: ["worker/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: worker/package.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
