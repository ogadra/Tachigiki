name: go

on:
  push:
    paths: ["**.go", "go.mod", "go.sum"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
